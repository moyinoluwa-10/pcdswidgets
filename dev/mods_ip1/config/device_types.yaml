# Device class -> screen, macros, and alarm-summary PVs for the IP1 MODS home screen.
# screen: file in screens/ (or an absolute path); leave it out for classes that only need status PVs.
# macros: passed to the screen. Templates: {name} {prefix} {prefix_nocolon} {doc}, plus the device's happi kwargs
# indicator_pvs: what the status dots watch; generated by tools/gen_indicator_pvs.py (edit screen/macros by hand).
# template_kwargs: happi kwargs the class needs to be built (e.g. tip_pv); they are also {...} templates.
#
# SmarAct and QminiSpectrometer use their IOC release's own screens (common/smaract R4.0.0, common/qmini R3.1.1).
# Tip/tilt stages use pcdswidgets' MotorTipTiltDouble (screens/tip_tilt.py).
# Classes without a screen open a placeholder (name, class, prefix) and still have status dots.
pcdsdevices.areadetector.detectors.LasBasler:
  screen: las_basler.ui
  macros:
    CAM: '{prefix_nocolon}'
    NAME: '{name}'
    DESC: '{doc}'
  indicator_pvs:
  - '{prefix}Acquire'
  - '{prefix}Cross4:MinX_RBV'
  - '{prefix}Cross4:MinY_RBV'
  - '{prefix}DetectorState_RBV'
  - '{prefix}Model_RBV'
  - '{prefix}NumImagesCounter_RBV'
  - '{prefix}Stats2:CentroidX_RBV'
  - '{prefix}Stats2:CentroidY_RBV'
  - '{prefix}Stats2:SigmaX_RBV'
  - '{prefix}Stats2:SigmaY_RBV'
pcdsdevices.epics_motor.SmarAct:
  screen: smaract.py
  macros:
    MOTOR: '{prefix}'
    NAME: '{name}'
  indicator_pvs:
  - '{prefix}.RBV'
pcdsdevices.device_types.EnvironmentalMonitor:
  screen: env_monitor.ui
  macros:
    PREFIX: '{prefix}'
    NAME: '{name}'
  indicator_pvs:
  - '{prefix}:1.VAL'
  - '{prefix}:2.VAL'
  - '{prefix}:3.VAL'
pcdsdevices.epics_motor.SmarActTipTilt:
  screen: tip_tilt.py
  macros:
    TIP: '{prefix}{tip_pv}'
    TILT: '{prefix}{tilt_pv}'
    NAME: '{name}'
  template_kwargs:
  - tip_pv
  - tilt_pv
  indicator_pvs:
  - '{prefix}{tilt_pv}:CHANTEMP'
  - '{prefix}{tilt_pv}:MODTEMP'
  - '{prefix}{tilt_pv}:STEP_COUNT'
  - '{prefix}{tilt_pv}:STEP_FORWARD'
  - '{prefix}{tilt_pv}:STEP_REVERSE'
  - '{prefix}{tilt_pv}:TOTAL_STEP_COUNT'
  - '{prefix}{tip_pv}:CHANTEMP'
  - '{prefix}{tip_pv}:MODTEMP'
  - '{prefix}{tip_pv}:STEP_COUNT'
  - '{prefix}{tip_pv}:STEP_FORWARD'
  - '{prefix}{tip_pv}:STEP_REVERSE'
  - '{prefix}{tip_pv}:TOTAL_STEP_COUNT'
pcdsdevices.epics_motor.SmarActEncodedTipTilt:
  screen: tip_tilt.py
  macros:
    TIP: '{prefix}{tip_pv}'
    TILT: '{prefix}{tilt_pv}'
    NAME: '{name}'
    STYLE: MotorRecord
  template_kwargs:
  - tip_pv
  - tilt_pv
  indicator_pvs:
  - '{prefix}{tilt_pv}.RBV'
  - '{prefix}{tip_pv}.RBV'
pcdsdevices.device_types.QminiSpectrometer:
  screen: qmini.py
  macros:
    prefix: '{prefix}'
    NAME: '{name}'
  indicator_pvs:
  - '{prefix}:SPECTRUM'
  - '{prefix}:STATUS'
  - '{prefix}:W0_FIT'
  - '{prefix}:WAVELENGTHS'
pcdsdevices.device_types.EllRotation:
  template_kwargs:
  - channel
  - port
  indicator_pvs:
  - '{prefix}:M{channel}:CURPOS'
pcdsdevices.device_types.EllLinear:
  template_kwargs:
  - channel
  - port
  indicator_pvs:
  - '{prefix}:M{channel}:CURPOS'
pcdsdevices.device_types.Ell6:
  template_kwargs:
  - channel
  - port
  indicator_pvs:
  - '{prefix}:M{channel}:CURPOS'
pcdsdevices.device_types.Ell9:
  template_kwargs:
  - channel
  - port
  indicator_pvs:
  - '{prefix}:M{channel}:CURPOS'
pcdsdevices.device_types.El3174AiCh:
  screen: power_meter.ui
  macros:
    PREFIX: '{prefix}'
    NAME: '{name}'
  indicator_pvs:
  - '{prefix}.VAL'
