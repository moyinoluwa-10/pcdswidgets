stations:
  INJ:
    title: Injection (1_lm1k4_inj)
    locations: [1_lm1k4_inj]
    tools:
      - [Tools, WFS Expert Screen]
  COM:
    title: Compression (2_lm1k4_com)
    locations: [2_lm1k4_com]
    tools:
      - [Tools, nf-ff-alignment, COM_DP1]
  OPA:
    title: Optical Parametric Amplification (3_lm1k4_opa)
    locations: [3_lm1k4_opa]
  HRM:
    title: Harmonics (3/4_lm1k4_hrm, 4_lm1k4_int)
    locations: [3_lm1k4_hrm, 4_lm1k4_hrm, 4_lm1k4_int]
  ATM:
    title: Arrival Time Monitor (5_lm1k4_atm)
    locations: [5_lm1k4_atm]
    tools:
      - [Tools, nf-ff-alignment, ATM_DP1]
      - [Tools, ATM non-LSS Shutter]
  EJX:
    title: Ejection (6_lm1k4_ejx)
    locations: [6_lm1k4_ejx]
    tools:
      - [Tools, EJX non-LSS Shutter]

