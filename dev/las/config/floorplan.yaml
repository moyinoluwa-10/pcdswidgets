# Layout and click behavior for the LAS floor plan.
#
# The laser hall is drawn by the screen itself, from the "hall" section below: a row of
# columns (bays, rack columns, the BTS) with relative widths and heights, laid out by Qt.
# Icons are placed inside their area by percentage, so they move and scale with it.
#
# What a click opens is a list of "opens" entries. One entry: a click opens it directly
# (ctrl+click new tab, shift+click new window, right click for the menu). Several: a click shows a menu.
#   device: <happi name>                  that device's screen (config/device_types.yaml)
#   devices: {location: [...], function: [...]}   every matching happi device, as a sub-menu
#   shutter: <LSn>                        that laser source's shutter screen (screens/laser_shutter.ui)
#   screen: <file in screens/>, macros: {...}, title: ...   any pydm screen
#   toolbar: [<tab>, <button>]            run that button's command from the LAS toolbar yaml (external window);
#                                         a button with several titled commands becomes a sub-menu
#   toolbar: [<tab>, <button>, <title>]   one command of a button that has several (its "titles")
#
# icon names: camera, smaract, thermometer, shutter, pdu, btps, or any FontAwesome 5 name.

# The hall, left to right. width = relative share of the hall width (gaps included);
# top / height = % of the hall height. Colors match the original drawing (bg-with-exp.png).
hall:
  aspect: 2.0 # width / height of the whole hall
  reference_height: 660 # preferred height in px (icon scale 1.0); icons drop their labels below 75 % of it
  background: "#eeeeee"
  border: "#595959"
  inactive: "#d7d7d7" # racks with nothing to open
  columns:
    - { gap: 3.5 }
    - { bay: Bay 1, width: 16, top: 12, height: 83, color: "#d9ead3" }
    - { gap: 4 }
    - racks:
        [
          { range: R01-R05, color: "#f9cb9c" },
          { range: R06-R10, color: "#b6d7a8" },
        ]
      width: 5.5
      top: 5 # also the bottom margin
      group_gap: 4
    - { gap: 4 }
    - { bay: Bay 2, width: 16, top: 12, height: 83, color: "#fce5cd" }
    - { gap: 4 }
    - { area: BTS, width: 26, top: 41, height: 27, color: "#d9d2e9" }
    - { gap: 4 }
    - { bay: Bay 3, width: 16, top: 12, height: 83, color: "#ead1dc" }
    - { gap: 4 }
    - racks:
        [
          { range: R11-R15, color: "#a4c2f4" },
          { range: R16-R20, color: "#d5a6bd" },
        ]
      width: 5.5
      top: 5
      group_gap: 4
    - { gap: 4 }
    - { bay: Bay 4, width: 16, top: 12, height: 83, color: "#c9daf8" }
    - { gap: 3.5 }

# happi functional_group -> menu title and icon, for auto-generated bay menus
functions:
  cameras: { title: Cameras, icon: camera }
  smaract: { title: SmarAct Motors, icon: smaract }
  env sensors: { title: Temperature / Humidity, icon: thermometer }

# happi lists the BTPS under "Bay 1"; it is shown on the BTS area instead of in the bay menu
bay_menu_skip_functions: [BTPS]

# Laser sources and the shutter screen for each (BTPS LS numbering)
shutters:
  LS1: { bay: Bay 1, title: LS1 (Bay 1) }
  LS3: { bay: Bay 2, title: LS3 (Bay 2 1um) }
  LS4: { bay: Bay 2, title: LS4 (Bay 2 800nm) }
  LS5: { bay: Bay 3, title: LS5 (Bay 3 800nm) }
  LS6: { bay: Bay 3, title: LS6 (Bay 3 1um) }
  LS8: { bay: Bay 4, title: LS8 (Bay 4) }

bays:
  Bay 1:
    locations: [Bay 1]
    tools: []
  Bay 2:
    locations: [Bay 2, Bay 2 - 1um, Bay 2 - 800nm]
    tools:
      - ["Bays 3/2", "Bay 2 Laser Protection (LPS-02)"]
      - ["Bays 3/2", "Bay 2 Delay Feedback"]
      - ["Bays 3/2", "Bay 2 SmarAct Control"]
      - ["Bays 3/2", "Bay 2 TPR Rep Rate Config"]
      - ["Bays 3/2", "Bay 2 Switching Mirror"]
      - ["Bays 3/2", "Bay 2 SMC Chiller"]
  Bay 3:
    locations: [Bay 3]
    tools:
      - ["Bays 3/2", "Bay 3 Laser Protection (LPS-01)"]
      - ["Bays 3/2", "Bay 3 Delay Feedback"]
      - ["Bays 3/2", "Bay 3 SmarAct Control"]
      - ["Bays 3/2", "Bay 3 TPR Rep Rate Config"]
      - ["Bays 3/2", "Bay 3 Switching Mirror"]
      - ["Bays 3/2", "Bay 3 SMC Chiller"]
  Bay 4:
    locations: [Bay 4]
    tools: []

# Small icons inside each area: in = the bay/area name, at = [x %, y %] of that area (icon center).
# Per bay: T/H near the top-left and bottom-right corners, shutters on the right edge (as in the sketch),
# cameras above the bay label, SmarAct below it.
icons:
  # Bay 1
  - {
      in: Bay 1,
      at: [18, 9],
      icon: thermometer,
      label: T/H,
      opens: [{ device: las_lhn_bay1_env_sens_1 }],
    }
  - {
      in: Bay 1,
      at: [81, 89],
      icon: thermometer,
      label: T/H,
      opens: [{ device: las_lhn_bay1_env_sens_2 }],
    }
  - {
      in: Bay 1,
      at: [78, 39],
      icon: shutter,
      label: Shutters,
      opens: [{ shutter: LS1 }],
    }
  - {
      in: Bay 1,
      at: [50, 25],
      icon: camera,
      label: Cameras,
      opens: [{ devices: { location: [Bay 1], function: [cameras] } }],
    }
  - {
      in: Bay 1,
      at: [50, 70],
      icon: smaract,
      label: SmarAct,
      opens: [{ devices: { location: [Bay 1], function: [smaract] } }],
    }
  # Bay 2
  - {
      in: Bay 2,
      at: [18, 9],
      icon: thermometer,
      label: T/H,
      opens: [{ device: las_lhn_bay2_env_sens_1 }],
    }
  - {
      in: Bay 2,
      at: [81, 89],
      icon: thermometer,
      label: T/H,
      opens: [{ device: las_lhn_bay2_env_sens_2 }],
    }
  - {
      in: Bay 2,
      at: [78, 39],
      icon: shutter,
      label: Shutters,
      opens: [{ shutter: LS3 }, { shutter: LS4 }],
    }
  - {
      in: Bay 2,
      at: [50, 25],
      icon: camera,
      label: Cameras,
      opens: [{ devices: { location: [Bay 2], function: [cameras] } }],
    }
  - {
      in: Bay 2,
      at: [50, 70],
      icon: smaract,
      label: SmarAct,
      opens:
        [
          {
            devices:
              { location: [Bay 2 - 1um, Bay 2 - 800nm], function: [smaract] },
          },
        ],
    }
  # Bay 3
  - {
      in: Bay 3,
      at: [18, 9],
      icon: thermometer,
      label: T/H,
      opens: [{ device: las_lhn_bay3_env_sens_1 }],
    }
  - {
      in: Bay 3,
      at: [81, 89],
      icon: thermometer,
      label: T/H,
      opens: [{ device: las_lhn_bay3_env_sens_2 }],
    }
  - {
      in: Bay 3,
      at: [78, 39],
      icon: shutter,
      label: Shutters,
      opens: [{ shutter: LS5 }, { shutter: LS6 }],
    }
  - {
      in: Bay 3,
      at: [50, 25],
      icon: camera,
      label: Cameras,
      opens: [{ devices: { location: [Bay 3], function: [cameras] } }],
    }
  - {
      in: Bay 3,
      at: [50, 70],
      icon: smaract,
      label: SmarAct,
      opens: [{ devices: { location: [Bay 3], function: [smaract] } }],
    }
  # Bay 4
  - {
      in: Bay 4,
      at: [18, 9],
      icon: thermometer,
      label: T/H,
      opens: [{ device: las_lhn_bay4_env_sens_1 }],
    }
  - {
      in: Bay 4,
      at: [81, 89],
      icon: thermometer,
      label: T/H,
      opens: [{ device: las_lhn_bay4_env_sens_2 }],
    }
  - {
      in: Bay 4,
      at: [78, 39],
      icon: shutter,
      label: Shutters,
      opens: [{ shutter: LS8 }],
    }
  - {
      in: Bay 4,
      at: [50, 25],
      icon: camera,
      label: Cameras,
      opens: [{ devices: { location: [Bay 4], function: [cameras] } }],
    }
  - {
      in: Bay 4,
      at: [50, 70],
      icon: smaract,
      label: SmarAct,
      opens: [{ devices: { location: [Bay 4], function: [smaract] } }],
    }
  # BTS
  - {
      in: BTS,
      at: [25, 81],
      icon: btps,
      label: BTPS,
      opens: [{ toolbar: ["NEH Beam Transport", "BTPS Overview"] }],
    }
  - {
      in: BTS,
      at: [75, 81],
      icon: camera,
      label: Cameras,
      opens: [{ devices: { location: [Beam Transport], function: [cameras] } }],
    }

# BTS area: opens the BTPS / BTMS and the other beam transport tools
areas:
  BTS:
    opens:
      - { devices: { location: [Beam Transport], function: [cameras] } }
      - { toolbar: ["NEH Beam Transport", "BTMS Overview"] }
      - { toolbar: ["NEH Beam Transport", "BTPS Overview"] }
      - { toolbar: ["NEH Beam Transport", "NEH Laser Hall Vacuum"] }
      - { toolbar: ["NEH Beam Transport", "Shutters"] }
      - { toolbar: ["NEH Beam Transport", "BTS All Motors"] }
      - { toolbar: ["NEH Beam Transport", "BTS SRS RGA"] }
      - { toolbar: ["NEH Beam Transport", "BTS QPCs"] }

# Racks R01-R20 come from the hall columns above. Each opens the LAS toolbar buttons in the "PDUs" tab
# whose names end with the rack in parentheses, e.g. "Zone 1 TiSaph PSU/Chiller PDU (R07)": a TrippLite PDU
# opens screens/pdu_tripplite.py in the dock, with the PV prefix its EDM launch uses; any other button runs.
# Add a matching button to the toolbar and the rack lights up; racks with no match are drawn grey (tooltip only).
# To override one rack, list it here with its own "opens:" list:
#   racks:
#     R05: { opens: [{ toolbar: ["PDUs", "Some PDU"] }] }
rack_toolbar_tab: PDUs
racks: {}
