beamline: LAS
title: LAS Home
toolbar: /cds/group/pcds/epics-dev/screens/pydm/lucid_config/LAS_toolbar.yaml

hall:
  reference_height: 660
  inactive: "#d7d7d7"
  columns:
    - { gap: 3.5 }
    - { bay: Bay 1, width: 16, top: 12, height: 83, color: "#d9ead3" }
    - { gap: 4 }
    - racks: [{ range: R01-R05, color: "#f9cb9c" }, { range: R06-R10, color: "#b6d7a8" }]
      width: 5.5
      top: 5
      group_gap: 4
    - { gap: 4 }
    - { bay: Bay 2, width: 16, top: 12, height: 83, color: "#fce5cd" }
    - { gap: 4 }
    - { area: BTS, width: 26, top: 41, height: 27, color: "#d9d2e9" }
    - { gap: 4 }
    - { bay: Bay 3, width: 16, top: 12, height: 83, color: "#ead1dc" }
    - { gap: 4 }
    - racks: [{ range: R11-R15, color: "#a4c2f4" }, { range: R16-R20, color: "#d5a6bd" }]
      width: 5.5
      top: 5
      group_gap: 4
    - { gap: 4 }
    - { bay: Bay 4, width: 16, top: 12, height: 83, color: "#c9daf8" }
    - { gap: 3.5 }

bay_menu_skip_functions: [BTPS]

shutters:
  LS1: { bay: Bay 1, title: LS1 (Bay 1) }
  LS3: { bay: Bay 2, title: LS3 (Bay 2 1um) }
  LS4: { bay: Bay 2, title: LS4 (Bay 2 800nm) }
  LS5: { bay: Bay 3, title: LS5 (Bay 3 800nm) }
  LS6: { bay: Bay 3, title: LS6 (Bay 3 1um) }
  LS8: { bay: Bay 4, title: LS8 (Bay 4) }

bays:
  Bay 2:
    locations: [Bay 2, Bay 2 - 1um, Bay 2 - 800nm]
    tools:
      - ["Bays 3/2", "Bay 2 Laser Protection (LPS-02)"]
      - ["Bays 3/2", "Bay 2 Delay Feedback"]
      - ["Bays 3/2", "Bay 2 SmarAct Control"]
      - ["Bays 3/2", "Bay 2 TPR Rep Rate Config"]
      - ["Bays 3/2", "Bay 2 Switching Mirror"]
      - ["Bays 3/2", "Bay 2 SMC Chiller"]
  Bay 3:
    tools:
      - ["Bays 3/2", "Bay 3 Laser Protection (LPS-01)"]
      - ["Bays 3/2", "Bay 3 Delay Feedback"]
      - ["Bays 3/2", "Bay 3 SmarAct Control"]
      - ["Bays 3/2", "Bay 3 TPR Rep Rate Config"]
      - ["Bays 3/2", "Bay 3 Switching Mirror"]
      - ["Bays 3/2", "Bay 3 SMC Chiller"]

icons:
  - { in: Bay 1, at: [18, 9], icon: thermometer, label: T/H, opens: [{ device: las_lhn_bay1_env_sens_1 }] }
  - { in: Bay 1, at: [81, 89], icon: thermometer, label: T/H, opens: [{ device: las_lhn_bay1_env_sens_2 }] }
  - { in: Bay 1, at: [78, 39], icon: shutter, label: Shutters, opens: [{ shutter: LS1 }] }
  - { in: Bay 1, at: [50, 25], icon: camera, label: Cameras, opens: [{ devices: { location: [Bay 1], function: [cameras] } }] }
  - { in: Bay 1, at: [50, 70], icon: smaract, label: SmarAct, opens: [{ devices: { location: [Bay 1], function: [smaract] } }] }
  - { in: Bay 2, at: [18, 9], icon: thermometer, label: T/H, opens: [{ device: las_lhn_bay2_env_sens_1 }] }
  - { in: Bay 2, at: [81, 89], icon: thermometer, label: T/H, opens: [{ device: las_lhn_bay2_env_sens_2 }] }
  - { in: Bay 2, at: [78, 39], icon: shutter, label: Shutters, opens: [{ shutter: LS3 }, { shutter: LS4 }] }
  - { in: Bay 2, at: [50, 25], icon: camera, label: Cameras, opens: [{ devices: { location: [Bay 2], function: [cameras] } }] }
  - { in: Bay 2, at: [50, 70], icon: smaract, label: SmarAct, opens: [{ devices: { location: [Bay 2 - 1um, Bay 2 - 800nm], function: [smaract] } }] }
  - { in: Bay 3, at: [18, 9], icon: thermometer, label: T/H, opens: [{ device: las_lhn_bay3_env_sens_1 }] }
  - { in: Bay 3, at: [81, 89], icon: thermometer, label: T/H, opens: [{ device: las_lhn_bay3_env_sens_2 }] }
  - { in: Bay 3, at: [78, 39], icon: shutter, label: Shutters, opens: [{ shutter: LS5 }, { shutter: LS6 }] }
  - { in: Bay 3, at: [50, 25], icon: camera, label: Cameras, opens: [{ devices: { location: [Bay 3], function: [cameras] } }] }
  - { in: Bay 3, at: [50, 70], icon: smaract, label: SmarAct, opens: [{ devices: { location: [Bay 3], function: [smaract] } }] }
  - { in: Bay 4, at: [18, 9], icon: thermometer, label: T/H, opens: [{ device: las_lhn_bay4_env_sens_1 }] }
  - { in: Bay 4, at: [81, 89], icon: thermometer, label: T/H, opens: [{ device: las_lhn_bay4_env_sens_2 }] }
  - { in: Bay 4, at: [78, 39], icon: shutter, label: Shutters, opens: [{ shutter: LS8 }] }
  - { in: Bay 4, at: [50, 25], icon: camera, label: Cameras, opens: [{ devices: { location: [Bay 4], function: [cameras] } }] }
  - { in: Bay 4, at: [50, 70], icon: smaract, label: SmarAct, opens: [{ devices: { location: [Bay 4], function: [smaract] } }] }
  - { in: BTS, at: [25, 81], icon: btps, label: BTPS, opens: [{ toolbar: ["NEH Beam Transport", "BTPS Overview"] }] }
  - { in: BTS, at: [75, 81], icon: camera, label: Cameras, opens: [{ devices: { location: [Beam Transport], function: [cameras] } }] }

areas:
  BTS:
    opens:
      - { devices: { location: [Beam Transport], function: [cameras] } }
      - { toolbar: ["NEH Beam Transport", "BTMS Overview"] }
      - { toolbar: ["NEH Beam Transport", "BTPS Overview"] }
      - { toolbar: ["NEH Beam Transport", "NEH Laser Hall Vacuum"] }
      - { toolbar: ["NEH Beam Transport", "Shutters"] }
      - { toolbar: ["NEH Beam Transport", "BTS All Motors"] }
      - { toolbar: ["NEH Beam Transport", "BTS SRS RGA"] }
      - { toolbar: ["NEH Beam Transport", "BTS QPCs"] }
