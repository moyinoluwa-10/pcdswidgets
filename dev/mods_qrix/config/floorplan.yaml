# Layout and click behavior for the QRIX MODS (LM1K2) floor plan.
#
# The table is drawn by the screen itself, from the "hall" section below: a row of stations in
# beam order (the numbered happi location groups 1_lm1k2_inj ... 5_lm1k2_ejx), with relative widths
# and heights, laid out by Qt. Icons are placed inside their station by percentage, so they move and
# scale with it. The proportions are rough; tune them here.
#
# What a click opens is a list of "opens" entries. One entry: a click opens it directly
# (ctrl+click new tab, shift+click new window, right click for the menu). Several: a click shows a menu.
#   device: <happi name>                  that device's screen (dev/home_screen/config/device_types.yaml)
#   devices: {location: [...], function: [...]}   every matching happi device, as a sub-menu
#   screen: <file>, macros: {...}, title: ...   any pydm screen (home_screen/screens/, this location's screens/, or absolute)
#   toolbar: [<tab>, <button>]            run that button's command from the toolbar yaml (external window)
#   toolbar: [<tab>, <button>, <title>]   one command of a button that has several (its "titles")
#
# icon names: camera, smaract, thermometer, shutter, spectrometer, elliptec, power-meter, wavefront,
# or any FontAwesome 5 name.

# What this location is: its happi beamline (every active device on it), the window title, and its toolbar
# (a copy of lucid_config's, relative to this file). dev/home_screen builds the screen from this file.
beamline: QRIX_MODS
title: QRIX MODS Home
toolbar: qrix_mods_toolbar.yaml

# The table, left to right in beam order. width = relative share of the drawing width (gaps included);
# top / height = % of the drawing height.
hall:
  aspect: 1.9 # width / height of the whole drawing
  reference_height: 520 # preferred height in px (icon scale 1.0); icons drop their labels below 75 % of it
  background: "#eeeeee"
  border: "#595959"
  inactive: "#d7d7d7" # stations with nothing to open
  columns:
    - { gap: 2 }
    - { station: INJ, width: 17.2, top: 8, height: 84, color: "#d9ead3" }
    - { gap: 2.4 }
    - { station: COM, width: 17.2, top: 8, height: 84, color: "#fce5cd" }
    - { gap: 2.4 }
    - { station: ATM, width: 17.2, top: 8, height: 84, color: "#c9daf8" }
    - { gap: 2.4 }
    - { station: OPA, width: 17.2, top: 8, height: 84, color: "#d9d2e9" }
    - { gap: 2.4 }
    - { station: EJX, width: 17.2, top: 8, height: 84, color: "#fff2cc" }
    - { gap: 2 }

# happi functional_group -> menu title and icon, for auto-generated station menus
functions:
  cameras: { title: Cameras, icon: camera }
  smaract: { title: SmarAct Motors, icon: smaract }
  spectrometers: { title: Spectrometers, icon: spectrometer }
  elliptecs: { title: Elliptecs, icon: elliptec }
  power meters: { title: Power Meters, icon: power-meter }
  wavefront sensors: { title: Wavefront Sensors, icon: wavefront }
  env sensors: { title: Temperature / Humidity, icon: thermometer }

# Each station: its happi location groups, and the toolbar tools that belong to it
stations:
  INJ:
    title: Injection (1_lm1k2_inj)
    locations: [1_lm1k2_inj]
    tools: []
  COM:
    title: Compression (2_lm1k2_com)
    locations: [2_lm1k2_com]
    tools: []
  ATM:
    title: Arrival Time Monitor (3_lm1k2_atm)
    locations: [3_lm1k2_atm]
    tools:
      - [Tools, Dispersion Scan ATM]
  OPA:
    title: Optical Parametric Amplification (4_lm1k2_opa)
    locations: [4_lm1k2_opa]
    tools:
      - [Tools, THz 1D-scan] # scans LM1K2:OPA_MP1_DLY1
  EJX:
    title: Ejection (5_lm1k2_ejx)
    locations: [5_lm1k2_ejx]
    tools: []

# Small icons inside each station: in = the station name, at = [x %, y %] of that station (icon center).
# One row per function, at the same height in every station, so rows line up across the table.
# Only functions a station has active devices for get an icon (an empty one would open nothing).
# QRIX_MODS has no environmental sensors or shutters in happi / the toolbar, so no T/H or shutter icons.
#   cameras 20, smaract 33, spectrometers 46, elliptecs 59
icons:
  # INJ
  - { in: INJ, at: [50, 20], icon: camera, label: Cameras, opens: [{ devices: { location: [1_lm1k2_inj], function: [cameras] } }] }
  - { in: INJ, at: [50, 33], icon: smaract, label: SmarAct, opens: [{ devices: { location: [1_lm1k2_inj], function: [smaract] } }] }
  # COM
  - { in: COM, at: [50, 20], icon: camera, label: Cameras, opens: [{ devices: { location: [2_lm1k2_com], function: [cameras] } }] }
  - { in: COM, at: [50, 33], icon: smaract, label: SmarAct, opens: [{ devices: { location: [2_lm1k2_com], function: [smaract] } }] }
  - { in: COM, at: [50, 46], icon: spectrometer, label: Spectrometer, opens: [{ devices: { location: [2_lm1k2_com], function: [spectrometers] } }] }
  - { in: COM, at: [50, 59], icon: elliptec, label: Elliptecs, opens: [{ devices: { location: [2_lm1k2_com], function: [elliptecs] } }] }
  # ATM
  - { in: ATM, at: [50, 33], icon: smaract, label: SmarAct, opens: [{ devices: { location: [3_lm1k2_atm], function: [smaract] } }] }
  - { in: ATM, at: [50, 59], icon: elliptec, label: Elliptecs, opens: [{ devices: { location: [3_lm1k2_atm], function: [elliptecs] } }] }
  # OPA
  - { in: OPA, at: [50, 20], icon: camera, label: Cameras, opens: [{ devices: { location: [4_lm1k2_opa], function: [cameras] } }] }
  - { in: OPA, at: [50, 33], icon: smaract, label: SmarAct, opens: [{ devices: { location: [4_lm1k2_opa], function: [smaract] } }] }
  - { in: OPA, at: [50, 59], icon: elliptec, label: Elliptecs, opens: [{ devices: { location: [4_lm1k2_opa], function: [elliptecs] } }] }
  # EJX
  - { in: EJX, at: [50, 20], icon: camera, label: Cameras, opens: [{ devices: { location: [5_lm1k2_ejx], function: [cameras] } }] }
  - { in: EJX, at: [50, 33], icon: smaract, label: SmarAct, opens: [{ devices: { location: [5_lm1k2_ejx], function: [smaract] } }] }
  - { in: EJX, at: [50, 46], icon: spectrometer, label: Spectrometer, opens: [{ devices: { location: [5_lm1k2_ejx], function: [spectrometers] } }] }
  - { in: EJX, at: [50, 59], icon: elliptec, label: Elliptecs, opens: [{ devices: { location: [5_lm1k2_ejx], function: [elliptecs] } }] }
