# Layout and click behavior for the v2 LAS floor plan.
#
# All coordinates are pixels in bg.png (1356 x 672). The screen scales them with the image.
#   rect: [x, y, width, height]     clickable area drawn on the image (bays, BTS, racks)
#   pos:  [x, y]                    center of a small icon button
#
# What a click opens is a list of "opens" entries. One entry: a click opens it directly
# (ctrl+click new tab, shift+click new window, right click for the menu). Several: a click shows a menu.
#   device: <happi name>                  v1 device screen (dev/v1/config/device_types.yaml)
#   devices: {location: [...], function: [...]}   every matching happi device, as a sub-menu
#   screen: <file in screens/>, macros: {...}, title: ...   any pydm screen
#   toolbar: [<tab>, <button>]            run that button's command from the LAS toolbar yaml (external window)
#     status: <happi name>                optional: the icon's status dot watches that device's PVs
#
# icon names: camera, smaract, thermometer, shutter, pdu, btps, or any FontAwesome 5 name.

image: bg.png

# happi functional_group -> menu title and icon, for auto-generated bay menus
functions:
  cameras: {title: Cameras, icon: camera}
  smaract: {title: SmarAct Motors, icon: smaract}
  env sensors: {title: Temperature / Humidity, icon: thermometer}

# happi lists the BTPS under "Bay 1"; it is shown on the BTS area instead of in the bay menu
bay_menu_skip_functions: [BTPS]

# Laser sources and the shutter screen for each (BTPS LS numbering)
shutters:
  LS1: {bay: Bay 1, title: LS1 (Bay 1)}
  LS3: {bay: Bay 2, title: LS3 (Bay 2 1um)}
  LS4: {bay: Bay 2, title: LS4 (Bay 2 800nm)}
  LS5: {bay: Bay 3, title: LS5 (Bay 3 800nm)}
  LS6: {bay: Bay 3, title: LS6 (Bay 3 1um)}
  LS8: {bay: Bay 4, title: LS8 (Bay 4)}

bays:
  Bay 1:
    rect: [47, 86, 163, 548]
    locations: [Bay 1]
    tools: []
  Bay 2:
    rect: [347, 86, 162, 548]
    locations: [Bay 2, Bay 2 - 1um, Bay 2 - 800nm]
    tools:
      - ["Bays 3/2", "Bay 2 Laser Protection (LPS-02)"]
      - ["Bays 3/2", "Bay 2 Delay Feedback"]
      - ["Bays 3/2", "Bay 2 SmarAct Control"]
      - ["Bays 3/2", "Bay 2 TPR Rep Rate Config"]
      - ["Bays 3/2", "Bay 2 Switching Mirror"]
      - ["Bays 3/2", "Bay 2 SMC Chiller"]
  Bay 3:
    rect: [851, 81, 156, 548]
    locations: [Bay 3]
    tools:
      - ["Bays 3/2", "Bay 3 Laser Protection (LPS-01)"]
      - ["Bays 3/2", "Bay 3 Delay Feedback"]
      - ["Bays 3/2", "Bay 3 SmarAct Control"]
      - ["Bays 3/2", "Bay 3 TPR Rep Rate Config"]
      - ["Bays 3/2", "Bay 3 Switching Mirror"]
      - ["Bays 3/2", "Bay 3 SMC Chiller"]
  Bay 4:
    rect: [1155, 81, 156, 548]
    locations: [Bay 4]
    tools: []

# Small icons at rough locations inside each area. Bay/BTS labels sit at about y=360, so icons avoid it.
# Per bay: T/H near the top-left and bottom-right corners, shutters on the right edge (as in the sketch),
# cameras above the label, SmarAct below it.
icons:
  # Bay 1
  - {pos: [77, 135], icon: thermometer, label: T/H, opens: [{device: las_lhn_bay1_env_sens_1}]}
  - {pos: [179, 575], icon: thermometer, label: T/H, opens: [{device: las_lhn_bay1_env_sens_2}]}
  - {pos: [174, 300], icon: shutter, label: Shutters, opens: [{shutter: LS1}]}
  - {pos: [128, 225], icon: camera, label: Cameras, opens: [{devices: {location: [Bay 1], function: [cameras]}}]}
  - {pos: [128, 470], icon: smaract, label: SmarAct, opens: [{devices: {location: [Bay 1], function: [smaract]}}]}
  # Bay 2
  - {pos: [377, 135], icon: thermometer, label: T/H, opens: [{device: las_lhn_bay2_env_sens_1}]}
  - {pos: [478, 575], icon: thermometer, label: T/H, opens: [{device: las_lhn_bay2_env_sens_2}]}
  - {pos: [473, 300], icon: shutter, label: Shutters, opens: [{shutter: LS3}, {shutter: LS4}]}
  - {pos: [427, 225], icon: camera, label: Cameras, opens: [{devices: {location: [Bay 2], function: [cameras]}}]}
  - {pos: [427, 470], icon: smaract, label: SmarAct, opens: [{devices: {location: [Bay 2 - 1um, Bay 2 - 800nm], function: [smaract]}}]}
  # Bay 3
  - {pos: [881, 135], icon: thermometer, label: T/H, opens: [{device: las_lhn_bay3_env_sens_1}]}
  - {pos: [976, 575], icon: thermometer, label: T/H, opens: [{device: las_lhn_bay3_env_sens_2}]}
  - {pos: [971, 300], icon: shutter, label: Shutters, opens: [{shutter: LS5}, {shutter: LS6}]}
  - {pos: [928, 225], icon: camera, label: Cameras, opens: [{devices: {location: [Bay 3], function: [cameras]}}]}
  - {pos: [928, 470], icon: smaract, label: SmarAct, opens: [{devices: {location: [Bay 3], function: [smaract]}}]}
  # Bay 4
  - {pos: [1185, 135], icon: thermometer, label: T/H, opens: [{device: las_lhn_bay4_env_sens_1}]}
  - {pos: [1280, 575], icon: thermometer, label: T/H, opens: [{device: las_lhn_bay4_env_sens_2}]}
  - {pos: [1275, 300], icon: shutter, label: Shutters, opens: [{shutter: LS8}]}
  - {pos: [1232, 225], icon: camera, label: Cameras, opens: [{devices: {location: [Bay 4], function: [cameras]}}]}
  - {pos: [1232, 470], icon: smaract, label: SmarAct, opens: [{devices: {location: [Bay 4], function: [smaract]}}]}
  # BTS
  - {pos: [615, 420], icon: btps, label: BTPS, opens: [{toolbar: ["NEH Beam Transport", "BTPS Overview"], status: las_btps}]}
  - {pos: [745, 420], icon: camera, label: Cameras, opens: [{devices: {location: [Beam Transport], function: [cameras]}}]}

# BTS area: opens the BTPS / BTMS and the other beam transport tools
areas:
  BTS:
    rect: [550, 278, 261, 176]
    opens:
      - {devices: {location: [Beam Transport], function: [cameras]}}
      - {toolbar: ["NEH Beam Transport", "BTMS Overview"]}
      - {toolbar: ["NEH Beam Transport", "BTPS Overview"], status: las_btps}
      - {toolbar: ["NEH Beam Transport", "NEH Laser Hall Vacuum"]}
      - {toolbar: ["NEH Beam Transport", "Shutters"]}
      - {toolbar: ["NEH Beam Transport", "BTS All Motors"]}
      - {toolbar: ["NEH Beam Transport", "BTS SRS RGA"]}
      - {toolbar: ["NEH Beam Transport", "BTS QPCs"]}

# Racks: each opens its PDU. Rack -> PDU comes from the LAS toolbar "PDUs" tab.
# Racks with no known PDU stay inert (tooltip only). The grey slots in the drawing are unlabeled.
racks:
