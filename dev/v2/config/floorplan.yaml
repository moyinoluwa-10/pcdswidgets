  R02: {rect: [251, 94, 55, 55]}
  R03: {rect: [251, 151, 55, 56], pdu: LAS:LHN:PWR:02, title: Zone 2 OPCPA Controls PDU}
  R04: {rect: [251, 209, 55, 55]}
  R06: {rect: [251, 349, 55, 55], pdu: LAS:LHN:PWR:06, title: Zone 1 BTS PDU}
  R07: {rect: [251, 407, 55, 55], pdu: LAS:LHN:PWR:07, title: Zone 1 TiSaph PSU/Chiller PDU}
  R08: {rect: [251, 464, 55, 55], pdu: LAS:LHN:PWR:01, title: Zone 1 TiSaph Timing PDU}
  R11: {rect: [1054, 37, 55, 55]}
  R12: {rect: [1054, 94, 55, 55]}
  R13: {rect: [1054, 151, 55, 56], pdu: LAS:LHN:PWR:04, title: Zone 4 TiSaph Timing PDU}
  R16: {rect: [1054, 349, 55, 55]}
  R17: {rect: [1054, 407, 55, 55]}
  R18: {rect: [1054, 464, 55, 55], pdu: LAS:LHN:PWR:03, title: Zone 3 OPCPA Timing PDU}
  R19: {rect: [1054, 521, 55, 55]}
